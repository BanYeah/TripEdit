# Transit+walk mode. REQUIRES valid local, date-relevant GTFS ZIP.
graphhopper:
  datareader.file: data/engine/busan.osm.pbf
  gtfs.file: data/engine/busan.gtfs.zip
  graph.location: data/engine/graph-cache-pt
  profiles:
    - name: foot
      custom_model_files:
        - foot.json
  import.osm.ignored_highways: motorway,trunk
  graph.encoded_values: foot_access, foot_average_speed, foot_priority, foot_road_access, hike_rating, mtb_rating, country, road_class
server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 127.0.0.1
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 127.0.0.1
